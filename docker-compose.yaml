services:
  # Write the advertised hostname, preferring REPLYCANT_HOSTNAME over
  # the host's <hostname>.local so TLS SANs and gitd stay in sync.
  # Docker VMs report names like docker-desktop; refuse those so Mac
  # users set REPLYCANT_HOSTNAME to the computer's Bonjour name.
  hostname-detect:
    image: alpine:3.23
    environment:
      - REPLYCANT_HOSTNAME
    volumes:
      - ${REPLYCANT_DATA_DIR:-./replycant-data}/hostname:/data/hostname
    entrypoint: /bin/sh
    command:
      - -ec
      - |
        if [ -z "$${REPLYCANT_HOSTNAME}" ]; then
          detected=$$(hostname)
          short=$${detected%%.*}
          case "$${short}" in
            docker-desktop|colima|lima|rancher-desktop)
              echo "hostname-detect: '$${short}' is a Docker VM hostname, not this computer." >&2
              echo "Set REPLYCANT_HOSTNAME to this machine's .local name, then retry:" >&2
              echo >&2
              echo '  echo REPLYCANT_HOSTNAME=$$(hostname) >> .env' >&2
              echo "  docker compose up" >&2
              exit 1
              ;;
          esac
          REPLYCANT_HOSTNAME="$${detected}.local"
        fi
        printf 'REPLYCANT_HOSTNAME=%s\n' "$${REPLYCANT_HOSTNAME}" \
          > /data/hostname/hostname.env
    network_mode: host

  init-repo:
    image: alpine/git:latest
    volumes:
      - ${REPLYCANT_DATA_DIR:-./replycant-data}/gitd/repo:/data/repo
    entrypoint: /bin/sh
    command: 
      - -ec
      - |
        cd /data/repo
        if [ -e HEAD ]; then
          echo "Repo already exists"
          exit 0
        fi
        git init --initial-branch=main --bare /data/repo

  # Create a server key for gitd if it doesn't exist
  server-key:
    image: alpine/openssl:3.5.4
    environment:
      - REPLYCANT_TAILNET_DOMAIN=${REPLYCANT_TAILNET_DOMAIN:-replycant.internal}
      - REPLYCANT_TUNNEL_DOMAIN=${REPLYCANT_TUNNEL_DOMAIN:-tunnel.replycant.com}
      - REPLYCANT_HEADSCALE_URL
    volumes:
      - ${REPLYCANT_DATA_DIR:-./replycant-data}/gitd/:/data/
      - ${REPLYCANT_DATA_DIR:-./replycant-data}/hostname:/data/hostname:ro
      - ${REPLYCANT_DATA_DIR:-./replycant-data}/tailnet:/data/tailnet
    depends_on:
      hostname-detect:
        condition: service_completed_successfully
    entrypoint: /bin/sh
    command:
      - -ec
      - |
        . /data/hostname/hostname.env

        cd /data/
        if [ ! -f ca.key ]; then
          # Create OpenSSL config for CA extensions
          cat > ca.cnf << CAEOF
        [req]
        distinguished_name = req_dn
        x509_extensions = v3_ca
        prompt = no

        [req_dn]
        CN = $$REPLYCANT_HOSTNAME

        [v3_ca]
        basicConstraints = critical, CA:TRUE
        keyUsage = critical, keyCertSign, cRLSign
        subjectKeyIdentifier = hash
        CAEOF

          # Generate CA key and self-signed certificate with CA extensions (P-256/prime256v1)
          openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:prime256v1 -out ca.key
          openssl req -new -x509 -key ca.key -out ca.crt -days 3650 -config ca.cnf
        fi

        # The tunnel hostname is derived from the CA so the reverse tunnel can
        # verify a registration by hashing the presented chain root, without
        # holding any shared secret. Truncated to 32 hex chars because a DNS
        # label cannot exceed 63 octets. Must stay in sync with
        # gitcrypt.CADNSLabel.
        CA_LABEL=$$(openssl x509 -in ca.crt -outform DER | sha256sum | cut -c1-32)

        # Devices reach gitd by its MagicDNS name once everything is on the
        # tailnet; the .local name is kept as a SAN so LAN-only deployments and
        # integration tests keep working.
        GITD_TAILNET_NAME="gitd.$${REPLYCANT_TAILNET_DOMAIN}"

        # Manual mode wins when the operator published headscale themselves,
        # because then the certificate has to match their own DNS name.
        if [ -n "$${REPLYCANT_HEADSCALE_URL}" ]; then
          HEADSCALE_HOST=$$(echo "$${REPLYCANT_HEADSCALE_URL}" | sed -e 's#^[a-z]*://##' -e 's#[:/].*$$##')
          HEADSCALE_URL="$${REPLYCANT_HEADSCALE_URL}"
        else
          HEADSCALE_HOST="$${CA_LABEL}.$${REPLYCANT_TUNNEL_DOMAIN}"
          HEADSCALE_URL="https://$${HEADSCALE_HOST}"
        fi

        # Written to a shared volume because every tailnet-aware service needs
        # the same derived names, and deriving them independently in each
        # service would let them drift.
        cat > /data/tailnet/tailnet.env << ENVEOF
        REPLYCANT_CA_LABEL=$${CA_LABEL}
        REPLYCANT_HEADSCALE_HOST=$${HEADSCALE_HOST}
        REPLYCANT_HEADSCALE_URL=$${HEADSCALE_URL}
        REPLYCANT_TAILNET_DOMAIN=$${REPLYCANT_TAILNET_DOMAIN}
        REPLYCANT_GITD_TAILNET_NAME=$${GITD_TAILNET_NAME}
        ENVEOF

        # Issues a leaf certificate from the existing CA. Kept as one function
        # so the gitd and hsproxy certs cannot drift in key type or lifetime.
        issue_cert() {
          name="$$1"
          primary="$$2"
          sans="$$3"
          openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:prime256v1 -out "$${name}.key"
          openssl req -new -key "$${name}.key" -out "$${name}.csr" \
            -subj "/CN=$${primary}" \
            -addext "subjectAltName=$${sans}"
          openssl x509 -req -in "$${name}.csr" -CA ca.crt -CAkey ca.key \
            -out "$${name}.crt" -days 3650 -CAcreateserial -copy_extensions copyall
          rm -f "$${name}.csr"
        }

        # Reports whether an existing cert already covers every SAN we need, so
        # a cert is only reissued when a name actually changed. Reissuing keeps
        # the same CA, so already-linked devices stay trusted.
        cert_covers() {
          file="$$1"
          shift
          [ -f "$$file" ] || return 1
          existing=$$(openssl x509 -in "$$file" -noout -ext subjectAltName \
            | tr ',' '\n' | tr -d ' ')
          for required in "$$@"; do
            echo "$$existing" | grep -Fqx "DNS:$${required}" || return 1
          done
          return 0
        }

        if cert_covers server.crt "$${REPLYCANT_HOSTNAME}" "$${GITD_TAILNET_NAME}"; then
          echo "Server certificate already covers $${REPLYCANT_HOSTNAME} and $${GITD_TAILNET_NAME}"
        else
          echo "Issuing gitd certificate for $${REPLYCANT_HOSTNAME} and $${GITD_TAILNET_NAME}"
          issue_cert server "$${REPLYCANT_HOSTNAME}" \
            "DNS:$${REPLYCANT_HOSTNAME},DNS:$${GITD_TAILNET_NAME}"
        fi

        # hsproxy terminates TLS for headscale, so its certificate has to match
        # the hostname devices dial - the tunnel subdomain, or the operator's
        # own name in manual mode.
        if cert_covers hsproxy.crt "$${HEADSCALE_HOST}" "$${REPLYCANT_HOSTNAME}"; then
          echo "hsproxy certificate already covers $${HEADSCALE_HOST}"
        else
          echo "Issuing hsproxy certificate for $${HEADSCALE_HOST}"
          issue_cert hsproxy "$${HEADSCALE_HOST}" \
            "DNS:$${HEADSCALE_HOST},DNS:$${REPLYCANT_HOSTNAME}"
        fi

  # Render the headscale config from the names server-key derived. Kept as its
  # own step because headscale's image is distroless and cannot template its
  # own config, and because server_url must not be guessed twice.
  headscale-config:
    image: alpine:3.23
    depends_on:
      server-key:
        condition: service_completed_successfully
    volumes:
      - ${REPLYCANT_DATA_DIR:-./replycant-data}/tailnet:/data/tailnet:ro
      - ${REPLYCANT_DATA_DIR:-./replycant-data}/headscale/config:/data/config
    entrypoint: /bin/sh
    command:
      - -ec
      - |
        . /data/tailnet/tailnet.env

        # base_domain must differ from the server_url domain, which is why the
        # tailnet uses .internal while the control plane uses the tunnel name.
        cat > /data/config/config.yaml << HSEOF
        server_url: $${REPLYCANT_HEADSCALE_URL}
        listen_addr: 0.0.0.0:8080
        metrics_listen_addr: 127.0.0.1:9090
        grpc_listen_addr: 127.0.0.1:50443
        grpc_allow_insecure: false

        # Left empty on purpose. hsproxy splices raw TCP and adds no
        # X-Forwarded-For, so trusting a proxy here would only let clients
        # spoof their own logged source address.
        trusted_proxies: []

        noise:
          private_key_path: /var/lib/headscale/noise_private.key

        prefixes:
          v4: 100.64.0.0/10
          v6: fd7a:115c:a1e0::/48
          allocation: sequential

        derp:
          server:
            # The embedded DERP server needs publicly reachable UDP for STUN
            # and an https server_url it terminates itself. Neither survives a
            # reverse TCP tunnel, so Tailscale's public DERP mesh is used
            # instead. Relayed traffic stays WireGuard-encrypted end to end.
            enabled: false
          urls:
            - https://controlplane.tailscale.com/derpmap/default
          paths: []
          auto_update_enabled: true
          update_frequency: 24h

        disable_check_updates: true

        database:
          type: sqlite
          sqlite:
            path: /var/lib/headscale/db.sqlite
            write_ahead_log: true

        # TLS is terminated by hsproxy, which also authenticates the device.
        # headscale itself only ever sees plaintext from the compose network.
        tls_cert_path: ""
        tls_key_path: ""

        log:
          level: info
          format: text

        policy:
          mode: database

        dns:
          magic_dns: true
          base_domain: $${REPLYCANT_TAILNET_DOMAIN}
          # Devices keep their own resolvers; replycant only needs name
          # resolution for its own tailnet hosts.
          override_local_dns: false
          nameservers:
            global: []
          search_domains: []
        HSEOF
        echo "Wrote headscale config for $${REPLYCANT_HEADSCALE_URL}"

  # The tailnet control plane. Never publishes a host port: devices reach it
  # through hsproxy, which authenticates them against the repository's pubkeys.
  headscale:
    image: ${REPLYCANT_HEADSCALE_IMAGE:-ghcr.io/juanfont/headscale:0.29.3}
    depends_on:
      headscale-config:
        condition: service_completed_successfully
    volumes:
      - ${REPLYCANT_DATA_DIR:-./replycant-data}/headscale/config:/etc/headscale:ro
      - ${REPLYCANT_DATA_DIR:-./replycant-data}/headscale/lib:/var/lib/headscale
      # The headscale CLI reaches the running server over this unix socket, so
      # headscale-init has to share the directory. A named volume rather than a
      # bind mount because unix sockets do not work reliably across the
      # host filesystem boundary on macOS.
      - headscale-run:/var/run/headscale
    command: ["serve"]
    restart: unless-stopped

  # Mint the tailnet user and the pre-auth key gitd needs to join.
  #
  # Uses the -debug image because the default headscale image is distroless and
  # has no shell. That image is built with ko, so its busybox shell lives at
  # /busybox/sh rather than /bin/sh. Pre-auth keys are only returned once at
  # creation, so the key is captured here and written to disk rather than read
  # back later.
  headscale-init:
    image: ${REPLYCANT_HEADSCALE_DEBUG_IMAGE:-ghcr.io/juanfont/headscale:0.29.3-debug}
    depends_on:
      headscale:
        condition: service_started
    volumes:
      - ${REPLYCANT_DATA_DIR:-./replycant-data}/headscale/config:/etc/headscale:ro
      - ${REPLYCANT_DATA_DIR:-./replycant-data}/headscale/lib:/var/lib/headscale
      - ${REPLYCANT_DATA_DIR:-./replycant-data}/tailnet:/data/tailnet
      - headscale-run:/var/run/headscale
    entrypoint: /busybox/sh
    command:
      - -ec
      - |
        # The CLI talks to the running server over the shared unix socket, so
        # wait for the server to be listening rather than for the database.
        for attempt in $$(seq 1 60); do
          if headscale users list >/dev/null 2>&1; then
            break
          fi
          echo "Waiting for headscale to be ready ($$attempt/60)..."
          sleep 1
        done

        # Reads one numeric field out of headscale's pretty-printed JSON.
        # Parsing this way avoids adding a JSON tool to the image; the output
        # is machine-generated so the field always appears as `"name": value`.
        json_number() {
          grep -o "\"$$1\": *[0-9]*" | head -n1 | grep -o '[0-9]*$$'
        }

        if [ -z "$$(headscale users list --name replycant --output json | json_number id)" ]; then
          echo "Creating replycant tailnet user"
          headscale users create replycant
        fi

        USER_ID=$$(headscale users list --name replycant --output json | json_number id)
        if [ -z "$$USER_ID" ]; then
          echo "Could not determine the replycant user id" >&2
          exit 1
        fi

        # gitd re-authenticates from its own tsnet state after the first join,
        # so the key is only minted when it has not been minted before.
        if [ ! -s /data/tailnet/gitd.authkey ]; then
          echo "Creating gitd pre-auth key for user $$USER_ID"
          headscale preauthkeys create --user "$$USER_ID" --expiration 24h --output json \
            | grep -o '"key": *"[^"]*"' \
            | sed -e 's/.*: *"//' -e 's/"$$//' \
            > /data/tailnet/gitd.authkey
          chmod 600 /data/tailnet/gitd.authkey
        fi

        if [ ! -s /data/tailnet/gitd.authkey ]; then
          echo "Failed to mint a gitd pre-auth key" >&2
          exit 1
        fi

        # gitd mints a fresh pre-auth key for every device that pairs, which it
        # does over headscale's HTTP API. The CLI is not an option there: it
        # talks over this container's unix socket, and sharing that with gitd
        # would hand it full control-plane administration.
        #
        # API keys, like pre-auth keys, are only shown at creation.
        if [ ! -s /data/tailnet/headscale.apikey ]; then
          echo "Creating headscale API key for gitd"
          headscale apikeys create --expiration 87600h \
            | tr -d '\r\n' \
            > /data/tailnet/headscale.apikey
          chmod 600 /data/tailnet/headscale.apikey
        fi

        if [ ! -s /data/tailnet/headscale.apikey ]; then
          echo "Failed to mint a headscale API key" >&2
          exit 1
        fi
        echo "headscale initialisation complete"

  # Authenticating front door for headscale. This is the only service intended
  # to be reachable from outside, either through the reverse tunnel or through a
  # manually forwarded router port.
  #
  # REPLYCANT_HSPROXY_BIND defaults to loopback so a default `docker compose up`
  # exposes nothing. Manual mode sets it to 0.0.0.0.
  hsproxy:
    image: ${REPLYCANT_GITD_IMAGE:-gitd:local}
    build:
      context: .
      dockerfile: Dockerfile
      target: gitd
    depends_on:
      server-key:
        condition: service_completed_successfully
      init-repo:
        condition: service_completed_successfully
      headscale:
        condition: service_started
    ports:
      - "${REPLYCANT_HSPROXY_BIND:-127.0.0.1}:${REPLYCANT_HSPROXY_PORT:-8443}:8443"
    volumes:
      - ${REPLYCANT_DATA_DIR:-./replycant-data}/gitd/repo:/data/repo:ro
      - ${REPLYCANT_DATA_DIR:-./replycant-data}/gitd/hsproxy.crt:/data/hsproxy.crt:ro
      - ${REPLYCANT_DATA_DIR:-./replycant-data}/gitd/hsproxy.key:/data/hsproxy.key:ro
    entrypoint: /usr/local/bin/hsproxy
    command:
      - --repo=/data/repo
      - --addr=:8443
      - --upstream=headscale:8080
      - --cert=/data/hsproxy.crt
      - --key=/data/hsproxy.key
      - --cache-ttl=5m
      - --health-addr=:8091
    restart: unless-stopped

  # Holds the outbound connection that publishes headscale through the hosted
  # relay, so the user never has to forward a router port.
  #
  # Gated behind the `tunnel` profile so manual-exposure deployments can leave
  # it out entirely: with REPLYCANT_HEADSCALE_URL set the operator publishes
  # hsproxy themselves and this service has nothing to do. `.env.example` sets
  # COMPOSE_PROFILES=tunnel so cloud discovery is what a fresh install gets.
  tunnel-agent:
    profiles: ["tunnel"]
    image: ${REPLYCANT_GITD_IMAGE:-gitd:local}
    build:
      context: .
      dockerfile: Dockerfile
      target: gitd
    depends_on:
      server-key:
        condition: service_completed_successfully
      hsproxy:
        condition: service_started
    volumes:
      - ${REPLYCANT_DATA_DIR:-./replycant-data}/gitd/hsproxy.crt:/data/hsproxy.crt:ro
      - ${REPLYCANT_DATA_DIR:-./replycant-data}/gitd/hsproxy.key:/data/hsproxy.key:ro
      - ${REPLYCANT_DATA_DIR:-./replycant-data}/gitd/ca.crt:/data/ca.crt:ro
    entrypoint: /usr/local/bin/tunnel-agent
    command:
      - --relay-addr=${REPLYCANT_TUNNEL_RELAY_ADDR:-tunnel.replycant.com:8444}
      - --upstream-addr=hsproxy:8443
      - --cert=/data/hsproxy.crt
      - --key=/data/hsproxy.key
      - --ca=/data/ca.crt
    restart: unless-stopped

  gitd:
    depends_on:
      server-key:
        condition: service_completed_successfully
      hostname-detect:
        condition: service_completed_successfully
      init-repo:
        condition: service_completed_successfully
      headscale-init:
        condition: service_completed_successfully
    image: ${REPLYCANT_GITD_IMAGE:-gitd:local}
    build:
      context: .
      dockerfile: Dockerfile
      target: gitd
    # No ports are published. gitd is reachable only over the tailnet, which is
    # what removes the need to forward anything on the user's router.
    environment:
      REPLYCANT_GIT_PORT: ${REPLYCANT_GIT_PORT:-8443}
      REPLYCANT_CA_PORT: ${REPLYCANT_CA_PORT:-8080}
      # Empty selects manual-exposure delivery: gitd still mints a credential
      # and seals a pairing record, but hands it back to the authorizing device
      # to display as a QR instead of publishing it to the hosted API.
      REPLYCANT_DISCOVERY_URL: ${REPLYCANT_DISCOVERY_URL-https://discovery.replycant.com}
    volumes:
      - ${REPLYCANT_DATA_DIR:-./replycant-data}/hostname:/data/hostname:ro
      - ${REPLYCANT_DATA_DIR:-./replycant-data}/tailnet:/data/tailnet:ro
      - ${REPLYCANT_DATA_DIR:-./replycant-data}/gitd/repo:/data/repo
      - ${REPLYCANT_DATA_DIR:-./replycant-data}/gitd/server.crt:/data/server.crt:ro
      - ${REPLYCANT_DATA_DIR:-./replycant-data}/gitd/server.key:/data/server.key:ro
      - ${REPLYCANT_DATA_DIR:-./replycant-data}/gitd/ca.crt:/data/ca.crt:ro
      - ${REPLYCANT_DATA_DIR:-./replycant-data}/gitd/tsnet:/data/tsnet
      - ${REPLYCANT_LFS_DIR:-./replycant-lfs}:/data/lfs
    entrypoint: /bin/sh
    command:
      - -xec
      - |
        . /data/hostname/hostname.env
        . /data/tailnet/tailnet.env
        exec gitd --repo=/data/repo --addr=:${REPLYCANT_GIT_PORT:-8443} --ca-addr=:${REPLYCANT_CA_PORT:-8080} --ca=/data/ca.crt --cert=/data/server.crt --key=/data/server.key --cache-ttl=5m --hostname=$$REPLYCANT_HOSTNAME --lfs-dir=/data/lfs --lfs-internal-addr=:8085 --decryptd-url=http://decryptd:8084 --transcoded-url=http://transcoded:8082 --tsnet-dir=/data/tsnet --tsnet-control-url=http://headscale:8080 --tsnet-hostname=gitd --tsnet-auth-key-file=/data/tailnet/gitd.authkey --tailnet-domain=$$REPLYCANT_TAILNET_DOMAIN --headscale-api-url=http://headscale:8080 --headscale-api-key-file=/data/tailnet/headscale.apikey --headscale-client-url=$$REPLYCANT_HEADSCALE_URL --discovery-url="$$REPLYCANT_DISCOVERY_URL"

  # Decrypts encrypted LFS objects on the fly. Reachable only through gitd's
  # mTLS-authenticated /decryptd route, so no host port is published.
  # Object bytes come from gitd's internal read-only LFS listener.
  decryptd:
    image: ${REPLYCANT_DECRYPTD_IMAGE:-decryptd:local}
    build:
      context: .
      dockerfile: Dockerfile
      target: decryptd
    depends_on:
      - gitd
    command:
      - --upstream=http://gitd:8085/lfs
      - --listen=:8084

  # Run transcoded for on-demand video segments. Reachable only through gitd's
  # mTLS-authenticated /transcoded route, so no host port is published.
  transcoded:
    image: ${REPLYCANT_TRANSCODED_IMAGE:-transcoded:local}
    build:
      context: .
      dockerfile: Dockerfile
      target: transcoded
    depends_on:
      - decryptd
    command:
      - --upstream=http://decryptd:8084

# Shares the headscale CLI unix socket between the server and its init job.
volumes:
  headscale-run:
