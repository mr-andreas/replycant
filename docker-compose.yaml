services:
  init-repo:
    image: alpine/git:latest
    volumes:
      - ${REPLYCANT_DATA_DIR:-./replycant-data}/gitd/repo:/data/repo
    entrypoint: /bin/sh
    command: 
      - -ec
      - |
        cd /data/repo
        if [ -e HEAD ]; then
          echo "Repo already exists"
          exit 0
        fi
        git init --initial-branch=main --bare /data/repo

  # Create a server key for gitd if it doesn't exist
  server-key:
    image: alpine/openssl:3.5.4
    environment:
      - REPLYCANT_TUNNEL_DOMAIN=${REPLYCANT_TUNNEL_DOMAIN:-tunnel.replycant.com}
    volumes:
      - ${REPLYCANT_DATA_DIR:-./replycant-data}/gitd/:/data/
      - ${REPLYCANT_DATA_DIR:-./replycant-data}/tailnet:/data/tailnet
    entrypoint: /bin/sh
    command:
      - -ec
      - |
        cd /data/
        if [ ! -f ca.key ]; then
          # Create OpenSSL config for CA extensions
          cat > ca.cnf << CAEOF
        [req]
        distinguished_name = req_dn
        x509_extensions = v3_ca
        prompt = no

        [req_dn]
        CN = Replycant CA

        [v3_ca]
        basicConstraints = critical, CA:TRUE
        keyUsage = critical, keyCertSign, cRLSign
        subjectKeyIdentifier = hash
        CAEOF

          # Generate CA key and self-signed certificate with CA extensions (P-256/prime256v1)
          openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:prime256v1 -out ca.key
          openssl req -new -x509 -key ca.key -out ca.crt -days 3650 -config ca.cnf
        fi

        # The tunnel hostname is derived from the CA so the reverse tunnel can
        # verify a registration by hashing the presented chain root, without
        # holding any shared secret. Truncated to 32 hex chars because a DNS
        # label cannot exceed 63 octets. Must stay in sync with
        # gitcrypt.CADNSLabel.
        CA_DIGEST=$$(openssl x509 -in ca.crt -outform DER | sha256sum | cut -d' ' -f1)
        CA_LABEL=$$(echo "$${CA_DIGEST}" | cut -c1-32)

        # Registrations live in one relay process's memory, so the relay fleet
        # is sharded by hostname rather than by shared state. The slot comes
        # from the digest byte just past the 32 hex chars the label consumes,
        # modulo a permanently fixed 64: growing the fleet repoints DNS for
        # some slots and never moves a deployment, so no hsproxy certificate
        # needs reissuing and no stored headscale_url goes stale.
        #
        # Must stay in sync with gitcrypt.CATunnelSlotFromDER; the cross-repo
        # fixture test in pkg/gitcrypt pins the two together.
        CA_SHARD_BYTE=$$(echo "$${CA_DIGEST}" | cut -c33-34)
        CA_SHARD=$$(printf 's%02d' $$(( 0x$${CA_SHARD_BYTE} % 64 )))

        # Devices reach gitd only by its MagicDNS name. Fixed, because clients
        # pin it: must match tailnetaddr.GitdHost.
        GITD_TAILNET_NAME="gitd.replycant.internal"

        HEADSCALE_HOST="$${CA_LABEL}.$${CA_SHARD}.$${REPLYCANT_TUNNEL_DOMAIN}"
        HEADSCALE_URL="https://$${HEADSCALE_HOST}"

        # Where the tunnel agent registers. Derived rather than configured so
        # an operator never has to know which shard their CA landed in; the
        # env var stays an override for self-hosted relays.
        if [ -n "$${REPLYCANT_TUNNEL_RELAY_ADDR}" ]; then
          TUNNEL_RELAY_ADDR="$${REPLYCANT_TUNNEL_RELAY_ADDR}"
        else
          TUNNEL_RELAY_ADDR="$${CA_SHARD}.$${REPLYCANT_TUNNEL_DOMAIN}:8444"
        fi

        # Written to a shared volume because every tailnet-aware service needs
        # the same derived names, and deriving them independently in each
        # service would let them drift.
        cat > /data/tailnet/tailnet.env << ENVEOF
        REPLYCANT_CA_LABEL=$${CA_LABEL}
        REPLYCANT_CA_SHARD=$${CA_SHARD}
        REPLYCANT_HEADSCALE_HOST=$${HEADSCALE_HOST}
        REPLYCANT_HEADSCALE_URL=$${HEADSCALE_URL}
        REPLYCANT_TUNNEL_RELAY_ADDR=$${TUNNEL_RELAY_ADDR}
        ENVEOF

        # Issues a leaf certificate from the existing CA. Kept as one function
        # so the gitd and hsproxy certs cannot drift in key type or lifetime.
        issue_cert() {
          name="$$1"
          primary="$$2"
          sans="$$3"
          openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:prime256v1 -out "$${name}.key"
          openssl req -new -key "$${name}.key" -out "$${name}.csr" \
            -subj "/CN=$${primary}" \
            -addext "subjectAltName=$${sans}"
          openssl x509 -req -in "$${name}.csr" -CA ca.crt -CAkey ca.key \
            -out "$${name}.crt" -days 3650 -CAcreateserial -copy_extensions copyall
          rm -f "$${name}.csr"
        }

        # Reports whether an existing cert already covers every SAN we need, so
        # a cert is only reissued when a name actually changed. Reissuing keeps
        # the same CA, so already-linked devices stay trusted.
        cert_covers() {
          file="$$1"
          shift
          [ -f "$$file" ] || return 1
          existing=$$(openssl x509 -in "$$file" -noout -ext subjectAltName \
            | tr ',' '\n' | tr -d ' ')
          for required in "$$@"; do
            echo "$$existing" | grep -Fqx "DNS:$${required}" || return 1
          done
          return 0
        }

        if cert_covers server.crt "$${GITD_TAILNET_NAME}"; then
          echo "Server certificate already covers $${GITD_TAILNET_NAME}"
        else
          echo "Issuing gitd certificate for $${GITD_TAILNET_NAME}"
          issue_cert server "$${GITD_TAILNET_NAME}" "DNS:$${GITD_TAILNET_NAME}"
        fi

        # hsproxy terminates TLS for headscale, so its certificate has to match
        # the hostname devices dial - the tunnel subdomain, or the operator's
        # own name in manual mode.
        #
        # The tailnet name is a SAN too, because a device that is already a
        # tailnet member reaches hsproxy through gitd's in-tailnet control
        # relay instead of through the tunnel. Both paths end at this same
        # certificate, so one missing SAN would pin every device to the relay.
        if cert_covers hsproxy.crt "$${HEADSCALE_HOST}" "$${GITD_TAILNET_NAME}"; then
          echo "hsproxy certificate already covers $${HEADSCALE_HOST}"
        else
          echo "Issuing hsproxy certificate for $${HEADSCALE_HOST}"
          issue_cert hsproxy "$${HEADSCALE_HOST}" \
            "DNS:$${HEADSCALE_HOST},DNS:$${GITD_TAILNET_NAME}"
        fi

  # Render the headscale config and policy from the names server-key derived.
  # headscale's image is distroless and cannot template its own config, so
  # gitd's image does it with the same tags and ports gitd and hsproxy use.
  headscale-config:
    image: ${REPLYCANT_GITD_IMAGE:-gitd:local}
    build:
      context: .
      dockerfile: Dockerfile
      target: gitd
    depends_on:
      server-key:
        condition: service_completed_successfully
    volumes:
      - ${REPLYCANT_DATA_DIR:-./replycant-data}/tailnet:/data/tailnet:ro
      - ${REPLYCANT_DATA_DIR:-./replycant-data}/headscale/config:/data/config
    entrypoint: /bin/sh
    command:
      - -ec
      - |
        . /data/tailnet/tailnet.env
        exec headscale-config --server-url="$$REPLYCANT_HEADSCALE_URL" --listen-addr=0.0.0.0:8080 --out-dir=/data/config

  # The tailnet control plane. Never publishes a host port: devices reach it
  # through hsproxy, which authenticates them against the repository's pubkeys.
  headscale:
    image: ${REPLYCANT_HEADSCALE_IMAGE:-ghcr.io/juanfont/headscale:0.29.3}
    depends_on:
      headscale-config:
        condition: service_completed_successfully
    volumes:
      - ${REPLYCANT_DATA_DIR:-./replycant-data}/headscale/config:/etc/headscale:ro
      - ${REPLYCANT_DATA_DIR:-./replycant-data}/headscale/lib:/var/lib/headscale
      - ${REPLYCANT_DATA_DIR:-./replycant-data}/headscale/noise:/var/lib/headscale-noise
      # The headscale CLI reaches the running server over this unix socket, so
      # headscale-init has to share the directory. A named volume rather than a
      # bind mount because unix sockets do not work reliably across the
      # host filesystem boundary on macOS.
      - headscale-run:/var/run/headscale
    command: ["serve"]
    restart: unless-stopped

  # Create the tailnet user and the API key gitd and hsproxy mint keys with.
  #
  # No tailnet key is captured here. headscale's database is a cache of
  # pubkeys/: gitd mints its own node's key, and devices mint theirs through
  # hsproxy, whenever headscale does not know them. Deleting headscale/lib
  # and running `docker compose up` therefore recovers without re-pairing.
  #
  # Uses the -debug image because the default headscale image is distroless and
  # has no shell. That image is built with ko, so its busybox shell lives at
  # /busybox/sh rather than /bin/sh.
  headscale-init:
    image: ${REPLYCANT_HEADSCALE_DEBUG_IMAGE:-ghcr.io/juanfont/headscale:0.29.3-debug}
    depends_on:
      headscale:
        condition: service_started
    volumes:
      - ${REPLYCANT_DATA_DIR:-./replycant-data}/headscale/config:/etc/headscale:ro
      - ${REPLYCANT_DATA_DIR:-./replycant-data}/headscale/lib:/var/lib/headscale
      - ${REPLYCANT_DATA_DIR:-./replycant-data}/tailnet:/data/tailnet
      - headscale-run:/var/run/headscale
    entrypoint: /busybox/sh
    command:
      - -ec
      - |
        # The CLI talks to the running server over the shared unix socket, so
        # wait for the server to be listening rather than for the database.
        for attempt in $$(seq 1 60); do
          if headscale users list >/dev/null 2>&1; then
            break
          fi
          echo "Waiting for headscale to be ready ($$attempt/60)..."
          sleep 1
        done

        # Reads one numeric field out of headscale's pretty-printed JSON.
        # Parsing this way avoids adding a JSON tool to the image; the output
        # is machine-generated so the field always appears as `"name": value`.
        json_number() {
          grep -o "\"$$1\": *[0-9]*" | head -n1 | grep -o '[0-9]*$$'
        }

        if [ -z "$$(headscale users list --name replycant --output json | json_number id)" ]; then
          echo "Creating replycant tailnet user"
          headscale users create replycant
        fi

        USER_ID=$$(headscale users list --name replycant --output json | json_number id)
        if [ -z "$$USER_ID" ]; then
          echo "Could not determine the replycant user id" >&2
          exit 1
        fi

        # gitd and hsproxy mint pre-auth keys over headscale's HTTP API. The
        # CLI is not an option there: it talks over this container's unix
        # socket, and sharing that would hand them full control-plane
        # administration.
        #
        # API keys are only shown at creation, so the key lives in a file. A
        # wiped database forgets it while the file survives, so a key
        # headscale no longer lists is replaced. headscale lists a key by
        # its first 22 characters: hskey-api- and a 12-character prefix.
        if [ -s /data/tailnet/headscale.apikey ]; then
          STORED_PREFIX=$$(cut -c1-22 /data/tailnet/headscale.apikey)
          if ! headscale apikeys list --output json | grep -Fq "\"$${STORED_PREFIX}-"; then
            echo "headscale no longer knows the stored API key; replacing it"
            rm -f /data/tailnet/headscale.apikey
          fi
        fi

        if [ ! -s /data/tailnet/headscale.apikey ]; then
          echo "Creating headscale API key for gitd and hsproxy"
          headscale apikeys create --expiration 87600h \
            | tr -d '\r\n' \
            > /data/tailnet/headscale.apikey
          chmod 600 /data/tailnet/headscale.apikey
        fi

        if [ ! -s /data/tailnet/headscale.apikey ]; then
          echo "Failed to mint a headscale API key" >&2
          exit 1
        fi
        echo "headscale initialisation complete"

  # Authenticating front door for headscale. Reachable from outside only
  # through the reverse tunnel. The host port stays on loopback so a default
  # `docker compose up` exposes nothing.
  hsproxy:
    image: ${REPLYCANT_GITD_IMAGE:-gitd:local}
    build:
      context: .
      dockerfile: Dockerfile
      target: gitd
    depends_on:
      server-key:
        condition: service_completed_successfully
      init-repo:
        condition: service_completed_successfully
      headscale:
        condition: service_started
      headscale-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${REPLYCANT_HSPROXY_PORT:-8443}:8443"
    volumes:
      - ${REPLYCANT_DATA_DIR:-./replycant-data}/gitd/repo:/data/repo:ro
      # The directory rather than the key file, so a key headscale-init
      # replaces after a database wipe is picked up without a restart.
      - ${REPLYCANT_DATA_DIR:-./replycant-data}/tailnet:/data/tailnet:ro
      - ${REPLYCANT_DATA_DIR:-./replycant-data}/gitd/hsproxy.crt:/data/hsproxy.crt:ro
      - ${REPLYCANT_DATA_DIR:-./replycant-data}/gitd/hsproxy.key:/data/hsproxy.key:ro
      - ${REPLYCANT_DATA_DIR:-./replycant-data}/gitd/ca.crt:/data/ca.crt:ro
    entrypoint: /usr/local/bin/hsproxy
    command:
      - --repo=/data/repo
      - --addr=:8443
      - --upstream=headscale:8080
      - --cert=/data/hsproxy.crt
      - --key=/data/hsproxy.key
      # Sent in the TLS chain so a phone restoring from a recovery key, which
      # holds only the CA's hash, can obtain the CA from the one server it
      # can reach.
      - --ca=/data/ca.crt
      - --cache-ttl=5m
      - --health-addr=:8091
      # Lets any device in pubkeys/ mint its own tailnet key, which is what
      # makes headscale's database disposable.
      - --headscale-api-url=http://headscale:8080
      - --headscale-api-key-file=/data/tailnet/headscale.apikey
    restart: unless-stopped

  # Holds the outbound connection that publishes headscale through the hosted
  # relay, so the user never has to forward a router port. A first device has
  # no other way to reach the control plane.
  tunnel-agent:
    image: ${REPLYCANT_GITD_IMAGE:-gitd:local}
    build:
      context: .
      dockerfile: Dockerfile
      target: gitd
    depends_on:
      server-key:
        condition: service_completed_successfully
      hsproxy:
        condition: service_started
    volumes:
      - ${REPLYCANT_DATA_DIR:-./replycant-data}/tailnet:/data/tailnet:ro
      - ${REPLYCANT_DATA_DIR:-./replycant-data}/gitd/hsproxy.crt:/data/hsproxy.crt:ro
      - ${REPLYCANT_DATA_DIR:-./replycant-data}/gitd/hsproxy.key:/data/hsproxy.key:ro
      - ${REPLYCANT_DATA_DIR:-./replycant-data}/gitd/ca.crt:/data/ca.crt:ro
    # Home routers often cache NXDOMAIN for names they looked up before the
    # shard records existed. Docker uses that resolver, so the agent would
    # never reach a relay that public DNS already knows.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    # The relay address comes from the shared tailnet.env rather than a
    # compose-level default, because it names the shard the CA hashes to and
    # only server-key knows that. Deriving it here again would be a second
    # place to get the modulus wrong.
    entrypoint: /bin/sh
    command:
      - -xec
      - |
        . /data/tailnet/tailnet.env
        exec /usr/local/bin/tunnel-agent \
          --relay-addr="$$REPLYCANT_TUNNEL_RELAY_ADDR" \
          --upstream-addr=hsproxy:8443 \
          --cert=/data/hsproxy.crt \
          --key=/data/hsproxy.key \
          --ca=/data/ca.crt
    restart: unless-stopped

  gitd:
    depends_on:
      server-key:
        condition: service_completed_successfully
      init-repo:
        condition: service_completed_successfully
      headscale-init:
        condition: service_completed_successfully
    image: ${REPLYCANT_GITD_IMAGE:-gitd:local}
    build:
      context: .
      dockerfile: Dockerfile
      target: gitd
    # The Git listener stays unpublished: it is bound to the tailnet, which is
    # what removes the need to forward anything on the user's router. The CA
    # page is the exception. A first device has no tailnet yet, so the only
    # way to show it a join QR is a host port.
    #
    # REPLYCANT_CA_BIND defaults to every interface so a server without a
    # browser can be bootstrapped from another machine on the LAN. That is
    # tolerable only because the page stops handing out join keys once the
    # first device has pushed. Set it to 127.0.0.1 to keep the page local.
    ports:
      - "${REPLYCANT_CA_BIND:-0.0.0.0}:${REPLYCANT_CA_PORT:-8080}:8080"
    environment:
      # Where pairing records are published. An empty value falls back to the
      # hosted API rather than switching delivery modes.
      REPLYCANT_DISCOVERY_URL: ${REPLYCANT_DISCOVERY_URL:-https://discovery.replycant.com}
    volumes:
      - ${REPLYCANT_DATA_DIR:-./replycant-data}/tailnet:/data/tailnet:ro
      - ${REPLYCANT_DATA_DIR:-./replycant-data}/gitd/repo:/data/repo
      - ${REPLYCANT_DATA_DIR:-./replycant-data}/gitd/server.crt:/data/server.crt:ro
      - ${REPLYCANT_DATA_DIR:-./replycant-data}/gitd/server.key:/data/server.key:ro
      - ${REPLYCANT_DATA_DIR:-./replycant-data}/gitd/ca.crt:/data/ca.crt:ro
      - ${REPLYCANT_DATA_DIR:-./replycant-data}/gitd/tsnet:/data/tsnet
      # The pubkeys/ set last reconciled with headscale, so a removed key
      # can be told apart from one that was never there.
      - ${REPLYCANT_DATA_DIR:-./replycant-data}/gitd/tailnet-state:/data/tailnet-state
      - ${REPLYCANT_LFS_DIR:-./replycant-lfs}:/data/lfs
    entrypoint: /bin/sh
    command:
      - -xec
      - |
        . /data/tailnet/tailnet.env
        exec gitd --repo=/data/repo --ca-addr=:8080 --ca=/data/ca.crt --cert=/data/server.crt --key=/data/server.key --cache-ttl=5m --lfs-dir=/data/lfs --lfs-internal-addr=:8085 --decryptd-url=http://decryptd:8084 --transcoded-url=http://transcoded:8082 --tsnet-dir=/data/tsnet --tsnet-control-url=http://headscale:8080 --headscale-api-url=http://headscale:8080 --headscale-api-key-file=/data/tailnet/headscale.apikey --headscale-client-url=$$REPLYCANT_HEADSCALE_URL --tailnet-reconcile-marker=/data/tailnet-state/reconciled-pubkeys.json --discovery-url="$$REPLYCANT_DISCOVERY_URL"
    restart: unless-stopped

  # Decrypts encrypted LFS objects on the fly. Reachable only through gitd's
  # mTLS-authenticated /decryptd route, so no host port is published.
  # Object bytes come from gitd's internal read-only LFS listener.
  decryptd:
    image: ${REPLYCANT_DECRYPTD_IMAGE:-decryptd:local}
    build:
      context: .
      dockerfile: Dockerfile
      target: decryptd
    depends_on:
      - gitd
    command:
      - --upstream=http://gitd:8085/lfs
      - --listen=:8084
    restart: unless-stopped

  # Run transcoded for on-demand video segments. Reachable only through gitd's
  # mTLS-authenticated /transcoded route, so no host port is published.
  transcoded:
    image: ${REPLYCANT_TRANSCODED_IMAGE:-transcoded:local}
    build:
      context: .
      dockerfile: Dockerfile
      target: transcoded
    depends_on:
      - decryptd
    command:
      - --upstream=http://decryptd:8084
    restart: unless-stopped

# Shares the headscale CLI unix socket between the server and its init job.
volumes:
  headscale-run:
