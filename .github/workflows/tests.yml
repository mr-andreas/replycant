name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-tests:
    name: Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install test dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg git-lfs

      # Git commits in tests need committer identity; --author alone is not
      # enough because git still requires user.name/user.email for the
      # committer. git-lfs is required by server/repo.Init.
      - name: Configure git for tests
        run: |
          set -euo pipefail
          git config --global user.email "ci@replycant.local"
          git config --global user.name "replycant-ci"
          git lfs install --skip-repo

      - name: Run Go tests
        run: go test ./... -tags integration -timeout 30m

  webapp-tests:
    name: Webapp tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: webapp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Run e2e tests
        run: npm run e2e

      - name: Run integration e2e tests
        run: npm run e2e:integration

  ios-tests:
    name: iOS tests
    runs-on: macos-26
    timeout-minutes: 90
    env:
      XCODE_VERSION: "26.5"
      IOS_TEST_DESTINATION: platform=iOS Simulator,name=iPhone 17 Pro Max
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          xcodebuild -version

      - name: Cache Swift package checkouts
        uses: actions/cache@v4
        with:
          path: |
            iosapp/build/test-derived-data/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-tests-spm-${{ hashFiles('iosapp/iosapp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project iosapp/iosapp.xcodeproj \
            -scheme iosapp

      - name: Run iOS tests
        run: make ios-test
