name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-tests:
    name: Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install ffmpeg
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run Go tests
        run: go test ./... -tags integration -timeout 30m

  # Catch Dockerfile regressions on both architectures before a
  # release, using the same native runners as the release workflow.
  server-images:
    name: Server images (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build gitd
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: gitd
          platforms: ${{ matrix.platform }}
          push: false

      - name: Build decryptd
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: decryptd
          platforms: ${{ matrix.platform }}
          push: false

      - name: Build transcoded
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: transcoded
          platforms: ${{ matrix.platform }}
          push: false

  # Playwright 1.58.2 does not support Ubuntu 26.04; keep this pin until that dependency is upgraded.
  webapp-tests:
    name: Webapp tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: webapp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npm run e2e

      - name: Run integration e2e tests
        run: xvfb-run -a npm run e2e:integration

  ios-unit-tests:
    name: iOS unit tests
    runs-on: macos-26
    timeout-minutes: 45
    env:
      XCODE_VERSION: "26.5"
      IOS_TEST_DESTINATION: platform=iOS Simulator,name=iPhone 17 Pro Max
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          xcodebuild -version

      - name: Build TailscaleKit
        uses: ./.github/actions/tailscalekit
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Cache Swift package checkouts
        uses: actions/cache@v4
        with:
          path: |
            iosapp/build/test-derived-data/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-tests-spm-${{ hashFiles('iosapp/iosapp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project iosapp/iosapp.xcodeproj \
            -scheme iosapp \
            -derivedDataPath iosapp/build/test-derived-data

      - name: Run iOS unit tests
        run: make ios-unit-test

  ios-ui-tests:
    name: iOS UI tests
    runs-on: macos-26
    timeout-minutes: 60
    env:
      XCODE_VERSION: "26.5"
      IOS_TEST_DESTINATION: platform=iOS Simulator,name=iPhone 17 Pro Max
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          xcodebuild -version

      - name: Build TailscaleKit
        uses: ./.github/actions/tailscalekit
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Cache Swift package checkouts
        uses: actions/cache@v4
        with:
          path: |
            iosapp/build/uitest-derived-data/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-uitests-spm-${{ hashFiles('iosapp/iosapp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project iosapp/iosapp.xcodeproj \
            -scheme iosappScreenshots \
            -derivedDataPath iosapp/build/uitest-derived-data

      - name: Run iOS UI tests
        env:
          # Destination failures write ResultBundle under TMPDIR, not derived data.
          TMPDIR: ${{ github.workspace }}/iosapp/build/xcodebuild-tmp
        run: |
          mkdir -p "$TMPDIR"
          make ios-ui-test

      # A started test writes iosapp/build/uitest-results.xcresult. A failure
      # before testing starts writes ResultBundle under TMPDIR instead.
      - name: Collect UI test results
        if: failure()
        run: |
          dest=iosapp/build/ui-test-results
          mkdir -p "$dest"
          if [ -d iosapp/build/uitest-results.xcresult ]; then
            cp -R iosapp/build/uitest-results.xcresult "$dest/"
          fi
          if [ -d iosapp/build/xcodebuild-tmp ]; then
            find iosapp/build/xcodebuild-tmp -name '*.xcresult' -prune -exec cp -R {} "$dest/" \;
          fi

      - name: Upload UI test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-test-results
          path: iosapp/build/ui-test-results
          if-no-files-found: error
