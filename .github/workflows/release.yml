name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example 1.2.3)
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  version:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
          TAG_NAME: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-${TAG_NAME#v}}"
          : "${version:?Could not resolve release version}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  release-server:
    name: Build and publish server images
    runs-on: ubuntu-latest
    needs: version
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image references
        env:
          INPUT_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          owner_lc="${GITHUB_REPOSITORY_OWNER,,}"
          repo_name="${GITHUB_REPOSITORY#*/}"
          repo_lc="${repo_name,,}"
          image_prefix="ghcr.io/${owner_lc}/${repo_lc}"

          {
            echo "VERSION=${INPUT_VERSION}"
            echo "IMAGE_PREFIX=${image_prefix}"
            echo "REPLYCANT_GITD_IMAGE=${image_prefix}/gitd:${INPUT_VERSION}"
            echo "REPLYCANT_DECRYPTD_IMAGE=${image_prefix}/decryptd:${INPUT_VERSION}"
            echo "REPLYCANT_TRANSCODED_IMAGE=${image_prefix}/transcoded:${INPUT_VERSION}"
          } >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build release images
        run: docker compose build gitd decryptd transcoded

      - name: Push versioned images
        run: docker compose push gitd decryptd transcoded

      - name: Tag and push latest images
        run: |
          set -euo pipefail
          docker tag "$REPLYCANT_GITD_IMAGE" "$IMAGE_PREFIX/gitd:latest"
          docker tag "$REPLYCANT_DECRYPTD_IMAGE" "$IMAGE_PREFIX/decryptd:latest"
          docker tag "$REPLYCANT_TRANSCODED_IMAGE" "$IMAGE_PREFIX/transcoded:latest"

          docker push "$IMAGE_PREFIX/gitd:latest"
          docker push "$IMAGE_PREFIX/decryptd:latest"
          docker push "$IMAGE_PREFIX/transcoded:latest"

      - name: Install yq
        run: |
          set -euo pipefail
          sudo curl -fsSL \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64 \
            -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Generate release docker-compose
        run: |
          set -euo pipefail
          mkdir -p release
          cp docker-compose.yaml release/docker-compose.yaml
          yq eval '
            .services.gitd.image = strenv(REPLYCANT_GITD_IMAGE) |
            .services.decryptd.image = strenv(REPLYCANT_DECRYPTD_IMAGE) |
            .services.transcoded.image = strenv(REPLYCANT_TRANSCODED_IMAGE) |
            del(.services.gitd.build) |
            del(.services.decryptd.build) |
            del(.services.transcoded.build)
          ' -i release/docker-compose.yaml

      - name: Upload server release asset
        uses: actions/upload-artifact@v4
        with:
          name: server-release-compose
          path: release/docker-compose.yaml

  build-cli:
    name: Build CLI binaries
    runs-on: ubuntu-latest
    needs: version
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build CLI archives
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release/cli

          tools=(
            "git-replycant ./git-replycant git-replycant"
            "replycant-importer ./replycant-importer replycant-importer"
          )
          targets=(
            "linux amd64"
            "linux arm64"
            "darwin amd64"
            "darwin arm64"
          )

          for tool in "${tools[@]}"; do
            read -r artifact_name package_path binary_name <<< "$tool"
            for target in "${targets[@]}"; do
              read -r goos goarch <<< "$target"
              dist_dir="$(mktemp -d)"
              CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
                go build -trimpath -o "${dist_dir}/${binary_name}" "${package_path}"
              tar -C "$dist_dir" -czf \
                "release/cli/${artifact_name}-v${VERSION}-${goos}-${goarch}.tar.gz" \
                "${binary_name}"
              rm -rf "$dist_dir"
            done
          done

      - name: Upload CLI release assets
        uses: actions/upload-artifact@v4
        with:
          name: cli-release-binaries
          path: release/cli/*.tar.gz

  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: webapp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Set desktop version
        run: npm pkg set version="${{ needs.version.outputs.version }}"

      - name: Run unit tests
        run: npm run test

      - name: Setup macOS notarization credentials
        if: matrix.os == 'macos-latest'
        env:
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          python3 -c 'import base64, os, sys; open(sys.argv[1], "wb").write(base64.b64decode(os.environ["ASC_KEY_BASE64"]))' "$APPLE_API_KEY_PATH"
          chmod 600 "$APPLE_API_KEY_PATH"
          {
            echo "APPLE_API_KEY=$APPLE_API_KEY_PATH"
            echo "APPLE_API_KEY_ID=$ASC_KEY_ID"
            echo "APPLE_API_ISSUER=$ASC_ISSUER_ID"
          } >> "$GITHUB_ENV"

      - name: Build desktop artifacts (macOS signed)
        if: matrix.os == 'macos-latest'
        run: npm run desktop:dist:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Build desktop artifacts (linux/windows)
        if: matrix.os != 'macos-latest'
        run: npm run desktop:dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify macOS signatures
        if: matrix.os == 'macos-latest'
        run: |
          APP_PATH=""
          for candidate in release/mac*/Replycant.app; do
            if [ -d "$candidate" ]; then
              APP_PATH="$candidate"
              break
            fi
          done

          if [ -z "$APP_PATH" ]; then
            echo "Signed app bundle not found under release/mac*/Replycant.app"
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --type execute --verbose "$APP_PATH"

          DMG_PATH=""
          for candidate in release/*.dmg; do
            if [ -f "$candidate" ]; then
              DMG_PATH="$candidate"
              break
            fi
          done

          if [ -z "$DMG_PATH" ]; then
            echo "DMG artifact not found under release/"
            exit 1
          fi

          spctl --assess --type open --context context:primary-signature --verbose "$DMG_PATH"

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            webapp/release/*.dmg
            webapp/release/*.AppImage
            webapp/release/*.deb
            webapp/release/*.exe

  publish:
    name: Publish unified release
    runs-on: ubuntu-latest
    needs: [version, release-server, build-cli, build-desktop]
    steps:
      - name: Download server release asset
        uses: actions/download-artifact@v4
        with:
          name: server-release-compose
          path: release-assets/server

      - name: Download CLI release assets
        uses: actions/download-artifact@v4
        with:
          name: cli-release-binaries
          path: release-assets/cli

      - name: Download desktop release assets
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets/desktop
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          files: |
            release-assets/server/docker-compose.yaml
            release-assets/cli/*.tar.gz
            release-assets/desktop/*.dmg
            release-assets/desktop/*.AppImage
            release-assets/desktop/*.deb
            release-assets/desktop/*.exe
